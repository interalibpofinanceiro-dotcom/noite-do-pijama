<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noite do Pijama · Inscrições encerradas</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: light dark; --bg:#faf2f5; --surface:#fff; --ink:#2a1b27; --muted:#8c7386; --accent:#e23670; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#1a1220; --surface:#241a29; --ink:#f5e9f1; --muted:#b79fb0; --accent:#f0568c; } }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
        background:var(--bg); color:var(--ink); font-family:"Work Sans",system-ui,sans-serif; text-align:center; }
  .card{ max-width:480px; background:var(--surface); border-radius:20px; padding:40px 28px; box-shadow:0 20px 40px -24px rgba(42,27,39,.35); }
  img{ width:120px; height:auto; margin-bottom:16px; }
  h1{ font-family:"Playfair Display",serif; font-size:30px; margin:0 0 12px; color:var(--accent); }
  p{ font-size:18px; line-height:1.5; margin:0 0 8px; }
  .muted{ color:var(--muted); font-size:15px; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Ministério de Mulheres Vila Camargo">
    <h1>Inscrições encerradas</h1>
    <p>As inscrições para a Noite do Pijama foram encerradas.</p>
    <p class="muted">Obrigada a todas que se inscreveram! 💗<br>Ministério de Mulheres Vila Camargo</p>
  </main>
</body>
</html>
